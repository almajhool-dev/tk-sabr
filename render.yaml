services:
  - type: web
    name: tk-sabr-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm test && npm run lint && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TIKTOK_ACCESS_TOKEN
        sync: false
      - key: DATA_PROVIDER_URL
        sync: false
      - key: DATA_PROVIDER_KEY
        sync: false
      - key: DATA_PROVIDER_NAME
        sync: false
      - key: DATA_PROVIDER_AUTHORIZED
        value: 'false'
      - key: AI_API_KEY
        sync: false
