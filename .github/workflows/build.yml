name: Check TK_SABR source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'TK_SABR_deploy.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Require source archive
        run: |
          test -s TK_SABR_deploy.zip || { echo 'Source ZIP has not been uploaded yet.'; exit 1; }
      - name: Extract source
        run: |
          mkdir website
          unzip -q -o TK_SABR_deploy.zip -d website
          test -f website/package.json
          test -f website/server.ts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'
        continue-on-error: true
      - name: Install dependencies
        working-directory: website
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: website
        run: npm run build
      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tksabr-frontend-dist
          path: website/dist/
          if-no-files-found: error
